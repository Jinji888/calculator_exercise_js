<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora básica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="calculadora">
        <input id="recuadro" readonly disabled>
        <div id="botones">
            <button type="button" onclick="agregarAlRecuadro('7')">7</button>
            <button type="button" onclick="agregarAlRecuadro('8')">8</button>
            <button type="button" onclick="agregarAlRecuadro('9')">9</button>
            <button type="button" onclick="agregarAlRecuadro('*')"class="operador-btn">*</button>
            <button type="button" onclick="agregarAlRecuadro('4')">4</button>
            <button type="button" onclick="agregarAlRecuadro('5')">5</button>
            <button type="button" onclick="agregarAlRecuadro('6')">6</button>
            <button type="button" onclick="agregarAlRecuadro('-')"class="operador-btn">-</button>
            <button type="button" onclick="agregarAlRecuadro('1')">1</button>
            <button type="button" onclick="agregarAlRecuadro('2')">2</button>
            <button type="button" onclick="agregarAlRecuadro('3')">3</button>
            <button type="button" onclick="agregarAlRecuadro('+')"class="operador-btn">+</button>
            <button type="button" onclick="agregarAlRecuadro('0')">0</button>
            <button type="button" onclick="agregarAlRecuadro('.')">.</button>
            <button type="button" onclick="calcular()">=</button>
            <button type="button" onclick="agregarAlRecuadro('/')"class="operador-btn">/</button>
            <button type="button" onclick="limpiarRecuadro()"class="operador-btn" id="clear-btn">AC</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
